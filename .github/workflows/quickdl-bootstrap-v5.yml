      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found under $SDK_ROOT"
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build QuickDL debug APK
        run: ./gradlew assembleGenericDebug --stacktrace

      - name: Pick easiest APK to install
        shell: bash
        run: |
          mkdir -p quickdl-artifact
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK="$(find app/build/outputs/apk -type f -name '*universal*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' | head -n 1)"
          fi
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" quickdl-artifact/QuickDL.apk
          cp QUICKDL.md quickdl-artifact/QUICKDL.md

      - name: Upload QuickDL APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickDL-APK
          path: quickdl-artifact/
          if-no-files-found: error
          retention-days: 30
